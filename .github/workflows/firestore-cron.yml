name: Apartment Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Trigger Firestore
        run: |
          echo '${{ secrets.FIREBASE_KEY }}' > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json
          gcloud config set project d-apartment554

          TOKEN=$(gcloud auth print-access-token)

          curl -X PATCH \
            "https://firestore.googleapis.com/v1/projects/d-apartment554/databases/(default)/documents/triggers/cron" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"fields":{"run":{"booleanValue":true}}}'

          rm /tmp/key.json
